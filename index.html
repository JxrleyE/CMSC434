<!DOCTYPE html>

<head>

    <title> Main Page </title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="device">
        <div id="Text" class="tabcontent scroll">
            <h1> Text screen</h1>
            Enough to make you scroll
            <br><br><br><br><br><br><br><br>

        <div id="LR" class="tabcontent">
            <h1> -Text in Lower right </h1>
            <p class="BR"> Bottom right </p>
            
        </div>

         <div id="Colors" class="tabcontent">
           <h1>Colors</h1>

            <p class="color-line-one">Yellow text on black</p>

            <p class="color-line-two">Purple text on yellow</p>

    
        </div>

        <div id="Profile" class="tabcontent">
            <h1>User Profile</h1>

            <div class="profile-content">
                <img src="icons/SmileyFace.png"
                    class="profile-image"
                    onclick="showWarning()">

                <p class="profile-name">Smiley</p>
            </div>

            <div id="profile-warning" class="warning">
                <span>
                    <strong>Warning!</strong> Do not click on the profile image.
                </span>
                <button class="close-warning" onclick="closeWarning()">×</button>
            </div>
        </div>

           <!-- IMPLEMENT HERE -->

        <div id="ToDo" class="tabcontent">
            <!-- IMPLEMENT HERE -->
        </div>

        <div class="footer">
            <button class="tablink" onclick="openCity('Text')" id="defaultOpen">
                <img src="icons/text.png" class="tabicon">
                Text
            </button>

            <button class="tablink" onclick="openCity('LR')">
                <img src="icons/LR.png" class="tabicon">
                LR
            </button>
            
            <button class="tablink" onclick="openCity('Colors')">
                <img src="icons/colors.png" class="tabicon">
                Colors
            </button>

            <button class="tablink" onclick="openCity('Profile')">

            </button>

            <button class="tablink" onclick="openCity('Choices')">

            </button>

            <button class="tablink" onclick="openCity('ToDo')">
